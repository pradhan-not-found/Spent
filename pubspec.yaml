name: spent
description: "Spent — a simple, professional expense tracker."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  audioplayers: ^6.8.1
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  intl: any
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/brands/
    - assets/sounds/
  fonts:
    - family: Switzer
      fonts:
        - asset: assets/fonts/Switzer-Variable.ttf
    # Fallback for glyphs Switzer doesn't have (₹ and other currency signs).
    - family: SpentFallback
      fonts:
        - asset: assets/fonts/Roboto-regular.ttf
        - asset: assets/fonts/Roboto-medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-bold.ttf
          weight: 700
